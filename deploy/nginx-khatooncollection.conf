# /etc/nginx/sites-available/khatooncollection.in
# certbot --nginx adds the HTTPS (443) blocks to this file automatically.

limit_req_zone $binary_remote_addr zone=khatoon_web:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.khatooncollection.in;
    return 301 https://khatooncollection.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name khatooncollection.in;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: serve them from disk with a long cache
    location /_next/static/ {
        alias /var/www/khatoon-web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        limit_req zone=khatoon_web burst=40 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
