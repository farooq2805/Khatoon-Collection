# /etc/nginx/sites-enabled/dashboard.khatooncollection.in.conf
# Admin dashboard. New dashboard (repo: dashboard/) = app.html + /app-assets.
# Pages not rebuilt yet fall through to the classic dashboard (index.html + /assets).
# Certificate: certbot (webroot /var/www/acme), renewed by certbot.timer.

server {
  listen 80;
  listen [::]:80;
  server_name dashboard.khatooncollection.in panel.khatooncollection.in;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dashboard.khatooncollection.in panel.khatooncollection.in;
  ssl_certificate /etc/letsencrypt/live/dashboard.khatooncollection.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dashboard.khatooncollection.in/privkey.pem;
  root /home/khatooncollection-api/htdocs/dashboard.khatooncollection.in;
  index index.html;

  # New dashboard
  location /app-assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location ~ ^/(login|orders(/[0-9]+)?|abandoned|customers|products)?/?$ {
    add_header Cache-Control "no-cache";
    try_files /app.html =404;
  }
  location /new/ { rewrite ^/new/?(.*)$ /$1 permanent; }

  # Classic dashboard (product editor, categories, coupons, reviews, banners…)
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
